<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShieldFocus | Blocked</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="blockedTitle">
        <div class="card-top">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                <path d="M12 2 4 5.5v6.2c0 5 3.3 9.5 8 10.8 4.7-1.3 8-5.8 8-10.8V5.5L12 2Zm0 3.2 5 2.2v4.3c0 3.7-2.3 7-5 8.1-2.7-1.1-5-4.4-5-8.1V7.4l5-2.2Z" />
              </svg>
            </span>
            <div>
              <p class="eyebrow">ShieldFocus</p>
              <h1 id="blockedTitle">This page has been blocked.</h1>
            </div>
          </div>

          <div class="countdown" aria-live="polite">
            <span class="countdown-ring" id="countdownRing" aria-hidden="true">
              <span class="countdown-value" id="countdownValue">10</span>
            </span>
            <p class="countdown-copy" id="countdownCopy">Redirecting soon</p>
          </div>
        </div>

        <p class="reason" id="reasonText">
          Protection is active because this site matched a blocking rule.
        </p>

        <p class="mode-notice" id="modeNotice" hidden></p>

        <div class="details-grid">
          <div class="detail">
            <span class="detail-label">Domain</span>
            <strong id="hostnameText">Unknown</strong>
          </div>
          <div class="detail">
            <span class="detail-label">Reason</span>
            <strong id="reasonValue">Unknown</strong>
          </div>
          <div class="detail">
            <span class="detail-label">Redirect</span>
            <strong id="redirectLabel">Previous site</strong>
          </div>
        </div>

        <div class="actions">
          <button class="button button-primary" id="primaryAction" type="button">
            Go back now
          </button>
          <button class="button button-secondary" id="googleAction" type="button">
            Open Google
          </button>
        </div>

        <p class="footnote">
          If you want to keep browsing, wait for the timer or use the controls above.
        </p>
      </section>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
