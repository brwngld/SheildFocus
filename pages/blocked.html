<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShieldFocus</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <p class="eyebrow">ShieldFocus</p>
        <h1>This page has been blocked.</h1>
        <p class="reason" id="reasonText">Protection is active.</p>
        <dl class="details">
          <div>
            <dt>Domain</dt>
            <dd id="hostnameText">Unknown</dd>
          </div>
          <div>
            <dt>Reason</dt>
            <dd id="reasonValue">Unknown</dd>
          </div>
        </dl>
        <button id="backButton" type="button">Go back</button>
      </section>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
