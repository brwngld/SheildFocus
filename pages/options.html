<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShieldFocus Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">ShieldFocus</p>
        <h1>Protection settings</h1>
        <p class="subtitle">Keep the UI simple. Keep the blocking logic strict.</p>
        <p class="status" id="statusMessage" aria-live="polite"></p>
      </header>

      <section class="grid">
        <article class="card">
          <h2>Status</h2>
          <label class="toggle">
            <span>Protection</span>
            <input id="enabledToggle" type="checkbox" />
          </label>
          <label class="toggle">
            <span>Strict mode</span>
            <input id="strictToggle" type="checkbox" />
          </label>
          <label class="toggle">
            <span>AI ready later</span>
            <input id="aiToggle" type="checkbox" />
          </label>
          <p class="metric"><strong id="blockedTodayCount">0</strong> blocked today</p>
        </article>

        <article class="card">
          <h2>Blocklists</h2>
          <form class="entry-form" id="blockedForm">
            <input id="blockedInput" type="text" placeholder="example.com" autocomplete="off" />
            <button type="submit">Add</button>
          </form>
          <ul class="list" id="blockedList"></ul>

          <form class="entry-form" id="allowedForm">
            <input id="allowedInput" type="text" placeholder="educational-site.org" autocomplete="off" />
            <button type="submit">Allow</button>
          </form>
          <ul class="list" id="allowedList"></ul>
        </article>

        <article class="card">
          <h2>Recent decisions</h2>
          <ul class="timeline" id="decisionList"></ul>
        </article>

        <article class="card">
          <h2>Backup</h2>
          <div class="actions">
            <button id="exportButton" type="button">Export settings</button>
            <label class="import">
              <input id="importInput" type="file" accept="application/json" />
              <span>Import settings</span>
            </label>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
